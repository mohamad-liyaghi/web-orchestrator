# Shared server body for the HTTPS and the plain HTTP listener.

root /usr/share/nginx/html;
index index.html;
limit_conn per_ip 64;

# Must come before anything that can `return`, so every response carries the policy.
include /etc/nginx/csp.conf;
include /etc/nginx/headers.conf;

if ($request_method !~ ^(?:GET|HEAD|POST)$) {
    return 405;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Content-Security-Policy violation reports (report-only mode). Accepted and dropped: the
# browser console already shows every violation while the policy is being verified.
location = /csp-report {
    access_log off;
    return 204;
}

# Dotfiles (.git, .env, ...) are never served.
location ~ /\. {
    access_log off;
    return 404;
}

# Anything that looks like a file is served as-is or 404s (a missing model must not come back
# as index.html with a 200).
location ~ \.[A-Za-z0-9]+$ {
    limit_except GET { deny all; }
    try_files $uri =404;
}

# Extension-less routes fall back to the single-page app.
location / {
    limit_except GET { deny all; }
    try_files $uri /index.html;
}
