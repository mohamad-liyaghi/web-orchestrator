# Orchestrator static server.
#
# Runs as the unprivileged `nginx` user on a read-only root filesystem: everything nginx writes
# (pid, temp files, the selected TLS certificate links) lives under /tmp, which compose mounts as
# a tmpfs. Ports are above 1024 so no capability is needed.
#
#   8443  HTTPS + HTTP/2. Browsers only expose the camera on a secure origin, so the container
#         terminates TLS itself (self-signed by default, see entrypoint.sh).
#   8080  Plain HTTP for a reverse proxy that terminates TLS in front of the container.

worker_processes auto;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/mime.extra.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/javascript application/javascript application/json
                  image/svg+xml application/manifest+json;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format main '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    # Limits: the app is static, nothing is uploaded. CSP reports are the only request body.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_conn_status 429;

    # Compression. Large text assets (js, css, wasm, json, svg) are also pre-compressed at build
    # time (deploy/precompress.mjs) and served from the .gz files via gzip_static; anything
    # without a .gz sibling is compressed on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml application/xml;

    # Cache policy by status and path. A map instead of per-location add_header, so the security
    # headers are never dropped by add_header inheritance. Errors are never cached.
    map "$status:$uri" $cache_control {
        default                                               "no-cache";
        "~^(?:200|206|304):/assets/"                          "public, max-age=31536000, immutable";
        "~^(?:200|206|304):/(?:models|mediapipe|samples)/"    "public, max-age=2592000";
        "~^(?:200|206|304):.*\.wasm$"                         "public, max-age=2592000";
        "~^[45]"                                              "no-store";
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        http2 on;
        server_name _;

        # Written by entrypoint.sh: links to the mounted certificate or the self-signed one.
        ssl_certificate     /tmp/tls/cert.pem;
        ssl_certificate_key /tmp/tls/key.pem;

        include /etc/nginx/site.conf;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # Only reachable through the reverse proxy (compose publishes it on 127.0.0.1), so trust
        # its X-Forwarded-For for logging and per-client limits.
        set_real_ip_from 127.0.0.0/8;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from ::1/128;
        set_real_ip_from fc00::/7;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        include /etc/nginx/site.conf;
    }
}
