# Response headers for every request. Declared once at server level; no location adds headers
# of its own, so nginx's add_header inheritance never drops these.

add_header Cache-Control $cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# The camera is the only powerful feature the app uses; everything else is switched off.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), publickey-credentials-get=(), xr-spatial-tracking=(), fullscreen=(self), screen-wake-lock=(self), autoplay=(self), picture-in-picture=()" always;
