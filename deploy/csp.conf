# Content-Security-Policy, kept in this one file (included at http level, like headers.conf).
#
#   script-src 'wasm-unsafe-eval'  MediaPipe compiles its WebAssembly runtime.
#   script-src / worker-src blob:  Tone.js loads its AudioWorklet from a blob: URL; MediaPipe may
#                                  start blob: workers.
#   style-src 'unsafe-inline'      runtime style attributes set by the UI.
#   media-src blob: mediastream:   camera preview and recording playback/download.
#   connect-src 'self' blob: data: models, wasm and samples are fetched from this origin only.
#
# Enforced: the integrated app (real camera tracking, every instrument, recording) runs with zero
# violations. To debug a new feature, swap the two add_header lines to go back to report-only;
# violations then show up in the browser console as "[Report Only]".

map $scheme $csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

add_header Content-Security-Policy "$csp; frame-ancestors 'none'" always;
# add_header Content-Security-Policy-Report-Only "$csp; report-uri /csp-report" always;
