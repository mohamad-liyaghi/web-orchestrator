# Content-Security-Policy, kept in this one file.
#
#   script-src 'wasm-unsafe-eval'  MediaPipe compiles its WebAssembly runtime.
#   script-src / worker-src blob:  Tone.js loads its AudioWorklet from a blob: URL; MediaPipe may
#                                  start blob: workers.
#   style-src 'unsafe-inline'      runtime style attributes set by the UI.
#   media-src blob: mediastream:   camera preview and recording playback/download.
#   connect-src 'self' blob: data: models, wasm and samples are fetched from this origin only.
#
# Shipped as REPORT-ONLY until the integrated app has been verified with it. Violations show up
# in the browser console as "[Report Only]". To enforce it, swap the two add_header lines below:
# the enforced header also carries frame-ancestors, which browsers ignore in report-only mode.

set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";

add_header Content-Security-Policy-Report-Only "$csp; report-uri /csp-report" always;
# add_header Content-Security-Policy "$csp; frame-ancestors 'none'" always;
