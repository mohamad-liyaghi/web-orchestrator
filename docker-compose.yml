# Orchestrator deployment.
#
#   cp .env.example .env     # set PUBLIC_HOST to the server's IP or hostname
#   docker compose up -d --build
#
# https://<PUBLIC_HOST>:8443 serves the app directly (self-signed certificate unless a real one is
# in TLS_CERT_DIR). 127.0.0.1:8088 is plain HTTP for a reverse proxy on the same host.
name: web-orchestrator

services:
  orchestrator:
    build: .
    image: web-orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    volumes:
      # Self-signed certificate, generated on first start and kept across restarts and rebuilds.
      - certs:/etc/nginx/certs/self-signed
      # Optional real certificate: put fullchain.pem + privkey.pem here (privkey.pem readable by
      # uid 101). An empty directory means "use the self-signed certificate".
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs/custom:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certs:
